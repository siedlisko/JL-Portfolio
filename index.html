<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prosta strona - obrazy jako linki</title>
  <!-- Wymuszenie odświeżenia pamięci podręcznej przez dodanie ?v=99 -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <!-- 1) Pierwszy obrazek -->
    <a class="single-link img-wrap tiny" href="/" aria-label="Strona główna">
      <img class="normal single-img" src="images/logo-glowne.png" alt="Obraz 1 - statyczny">
    </a>

    <!-- 2) Obrazek -->
    <div class="item" tabindex="0">
      <a class="img-wrap" href="subpage2.html" aria-label="Przejdź do podstrony 2">
        <img class="normal" src="images/menu/o_mnie_image.png" alt="Obraz 2 - normalny">
        <img class="hover" src="images/menu/O_mnie_hover.png" alt="Obraz 2 - wersja po najechaniu">
      </a>
    </div>

    <!-- 3) Obrazek (50% większy) -->
    <div class="item scale-150" tabindex="0">
      <a class="img-wrap" href="subpage3.html" aria-label="Przejdź do podstrony 3">
        <img class="normal" src="images/menu/p_przyrodnicze_image.png" alt="Obraz 3 - normalny">
        <img class="hover" src="images/menu/przyrodnicze_hover.png" alt="Obraz 3 - wersja po najechaniu">
      </a>
    </div>

    <!-- 4) Obrazek -->
    <div class="item" tabindex="0">
      <a class="img-wrap" href="subpage4.html" aria-label="Przejdź do podstrony 4">
        <img class="normal" src="images/menu/Kontakt_image.png" alt="Obraz 4 - normalny">
        <img class="hover" src="images/menu/kontakt_hover.png" alt="Obraz 4 - wersja po najechaniu">
      </a>
    </div>
    
    <!-- 5) Obrazek z e-mailem -->
    <div class="item scale-130" tabindex="0">
      <a class="img-wrap" href="#" data-email="juliadarialew@wp.pl" aria-label="Kliknij, aby skopiować email">
        <img class="normal" src="images/menu/zlecenia_image.gif" alt="Obraz 5 - animowany GIF">
        <img class="hover no-cover" src="images/menu/Contact_image.png" alt="Obraz 5 - wersja po najechaniu">
        <span class="copied-msg" aria-hidden="true">Skopiowano</span>
      </a>
    </div>
    
    <!-- 6) Statyczny napis -->
    <div class="static-text" role="status">
      Copyright Julia Lew
    </div>
  </div>

  <script>
    // Działający skrypt kopiowania po kliknięciu
    document.querySelectorAll('[data-email]').forEach(link => {
      link.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = link.dataset.email;
        if (!email) return;

        try {
          await navigator.clipboard.writeText(email);
          const msg = link.querySelector('.copied-msg');
          if (msg) {
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 2000);
          }
        } catch (err) {
          alert('Adres email: ' + email);
        }
      });
    });
  </script>
</body>
</html>
