<!doctype html>
<html lang="pl-PL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O mnie - Julia Lew</title>
  <meta name="description" content="O mnie - Julia Lew">
  <link rel="icon" href="index.html">
  <style>
    /* Minimalny styl dla statycznej strony */
    :root{--max-width:900px;}
    html,body{height:100%}
    body {
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color:#222;
      background:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .site {
      max-width:var(--max-width);
      margin:0 auto;
      padding:3rem 1rem;
      text-align:center;
    }
    header{margin-bottom:1.5rem;}
    header .logo img{max-width:220px;height:auto;display:inline-block;}
    h1{font-size:1.5rem;margin:0 0 0.75rem;}
    .about-text{font-size:1.125rem;margin-bottom:2rem;}
    .profile-img{max-width:100%;height:auto;border-radius:8px;}
    footer{margin-top:2.5rem;color:#666;font-size:0.9rem}
    a{color:inherit;text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="site">
    <header>
     <a class="single-link img-wrap tiny" href="https://julialew.pl" aria-label="Strona główna">
      <img class="single-img" src="images/logo-glowne.png" alt="Obraz 1 - statyczny">
    </a>
    </header>

    <main role="main">
      <h1>Julia Lew</h1>
      <p class="about-text">Tu będzie coś o mnie, jak dowiem się kim jestem..</p>
      
      <!-- Podmień adres w src na właściwy link do obrazka -->
      <img class="profile-img" src="images/lew-about.gif" alt="Julia Lew - O mnie">
    </main>

    <footer>
      <p>© Julia Lew</p>
    </footer>
  </div>
</body>
</html>
